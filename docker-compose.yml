version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: learning-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    # Optional: If you want to use a volume for persistent local storage, uncomment below
    # volumes:
    #   - ./backend_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: learning-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
