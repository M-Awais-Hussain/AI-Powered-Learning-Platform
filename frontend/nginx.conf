server {
    listen 80;
    
    # Enable gzip compression for faster load times
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Serve React static files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Fixes React Router page refreshes
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the FastAPI backend container
    location /api/ {
        # The hostname "backend" corresponds to the service name in docker-compose.yml
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
